<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Acupuncture 3D Atlas — Kinh Lạc Huyệt Đạo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#0a0e14; --bg2:#0e1420; --panel:#111a26; --glass:rgba(17,26,38,.86);
  --line:rgba(120,180,220,.14); --txt:#dbe7f0; --dim:#7f93a6;
  --gold:#d8b45a; --teal:#39c2b4; --acc:#4aa8ff;
  --kim:#e8c96a; --moc:#5fbf6e; --thuy:#4aa8ff; --hoa:#e0604f; --tho:#c98bd4;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh}
/* ---------- 3D stage ---------- */
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;
  background:radial-gradient(1200px 700px at 50% 28%,#13203255 0%,#0a0e14 70%)}
#stage canvas{display:block}
#hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:11px;color:var(--dim);
  background:rgba(10,14,20,.55);padding:4px 12px;border-radius:20px;pointer-events:none;white-space:nowrap}
#compass{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;width:52px;height:52px;
  border-radius:50%;background:rgba(10,14,20,.6);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;pointer-events:none}
#compass span{font-size:11px;color:var(--gold);font-weight:700}
/* ---------- top bar ---------- */
#topbar{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;
  display:flex;align-items:center;gap:10px;pointer-events:none;z-index:5}
#topbar>*{pointer-events:auto}
#title{font-size:15px;font-weight:800;letter-spacing:.4px}
#title small{display:block;font-size:9.5px;color:var(--gold);font-weight:600;letter-spacing:1.5px}
#topbar .sp{flex:1}
.pillbtn{border:1px solid var(--line);background:rgba(10,14,20,.65);color:var(--txt);border-radius:12px;
  padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;backdrop-filter:blur(8px)}
.pillbtn.on{border-color:var(--gold);color:var(--gold)}
/* ---------- toolbar ---------- */
#toolbar{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);
  display:flex;gap:8px;padding:0 12px;overflow-x:auto;scrollbar-width:none;z-index:5}
#toolbar::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;
  padding:7px 12px;font-size:11.5px;font-weight:600;background:var(--glass);color:var(--dim);cursor:pointer;backdrop-filter:blur(10px)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.on{color:var(--txt);border-color:var(--acc)}
/* ---------- bottom nav ---------- */
#nav{height:calc(56px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex;background:var(--bg2);border-top:1px solid var(--line);z-index:10}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--dim);font-size:10px;font-weight:600;cursor:pointer;border:none;background:none}
.navbtn .ic{font-size:19px;line-height:1}
.navbtn.on{color:var(--gold)}
/* ---------- side sheet ---------- */
#sheet{position:fixed;left:0;right:0;bottom:0;height:78dvh;background:var(--bg2);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;transform:translateY(102%);transition:transform .32s cubic-bezier(.32,.9,.35,1);
  z-index:40;display:flex;flex-direction:column;box-shadow:0 -12px 40px #000a}
#sheet.open{transform:translateY(0)}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:#3a4a5a;margin:8px auto 4px}
#sheetHead{display:flex;align-items:center;gap:10px;padding:4px 16px 10px;border-bottom:1px solid var(--line)}
#sheetHead h2{font-size:16px;flex:1}
#sheetBody{flex:1;overflow-y:auto;padding:14px 16px 24px;-webkit-overflow-scrolling:touch}
.elbadge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:10px;letter-spacing:.6px}
.xbtn{border:1px solid var(--line);background:none;color:var(--dim);width:30px;height:30px;border-radius:10px;font-size:14px;cursor:pointer}
/* ---------- list rows ---------- */
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.row .grow{flex:1;min-width:0}
.row .t1{font-size:13.5px;font-weight:700}
.row .t2{font-size:11px;color:var(--dim);margin-top:2px}
.row .code{font-size:11px;font-weight:800;color:var(--acc);background:rgba(74,168,255,.12);
  padding:3px 8px;border-radius:8px;flex:0 0 auto}
/* search */
#searchBox{position:sticky;top:0;background:var(--bg2);padding:2px 0 10px;z-index:2}
#searchBox input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);color:var(--txt);font-size:14px;outline:none}
#searchBox input:focus{border-color:var(--acc)}
.seg{display:flex;background:var(--panel);border-radius:12px;padding:3px;margin:10px 0}
.seg div{flex:1;text-align:center;font-size:12px;font-weight:700;padding:7px;border-radius:9px;color:var(--dim);cursor:pointer}
.seg div.on{background:#1d2c3e;color:var(--gold)}
/* point detail blocks */
.pblock{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.pblock h4{font-size:11px;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.pblock p{font-size:13px;line-height:1.55;color:var(--txt)}
.kv{display:flex;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
.kv b{color:var(--dim);flex:0 0 96px;font-weight:600}
/* slider */
.ctl{display:flex;align-items:center;gap:10px;padding:9px 2px;font-size:12.5px;color:var(--dim)}
.ctl label{flex:0 0 118px;font-weight:600}
.ctl input[type=range]{flex:1;accent-color:var(--teal)}
/* quick look popup */
#quick{position:absolute;transform:translate(-50%,-115%);background:var(--glass);border:1px solid var(--gold);
  border-radius:12px;padding:9px 13px;pointer-events:none;z-index:6;display:none;backdrop-filter:blur(10px);max-width:230px}
#quick .qt{font-size:13px;font-weight:800;color:var(--gold)}
#quick .qs{font-size:11px;color:var(--txt);margin-top:2px;line-height:1.4}
/* toast */
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:var(--glass);border:1px solid var(--gold);
  color:var(--gold);padding:9px 18px;border-radius:20px;font-size:12.5px;font-weight:700;z-index:60;display:none}
/* home hero */
.hero{padding:22px 16px 8px;text-align:center}
.hero .yin{width:96px;height:96px;margin:0 auto 12px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 32% 30%,#26405c,#0d1520 70%);border:1px solid var(--gold);
  box-shadow:0 0 34px #d8b45a33;display:flex;align-items:center;justify-content:center;font-size:40px;animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h1{font-size:21px;font-weight:800}
.hero p{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.5}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:14px 16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--gold)}
.stat span{font-size:10px;color:var(--dim);font-weight:600}
.menu{padding:4px 16px 30px}
.mbtn{display:flex;align-items:center;gap:13px;width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;margin-bottom:10px;color:var(--txt);cursor:pointer;text-align:left}
.mbtn .mi{font-size:22px;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.mbtn b{font-size:14px;display:block}
.mbtn span{font-size:11px;color:var(--dim)}
.disclaim{font-size:10px;color:var(--dim);text-align:center;padding:0 24px 26px;line-height:1.5}
/* quiz */
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0}
.qcard .qq{font-size:14.5px;font-weight:700;line-height:1.5;margin-bottom:12px}
.qopt{display:block;width:100%;text-align:left;background:#0d1622;border:1px solid var(--line);color:var(--txt);
  border-radius:11px;padding:11px 13px;margin-bottom:8px;font-size:13px;cursor:pointer}
.qopt.right{border-color:#5fbf6e;background:#12281a}
.qopt.wrong{border-color:#e0604f;background:#2b1512}
.qbar{height:6px;border-radius:3px;background:var(--panel);overflow:hidden;margin:10px 0}
.qbar i{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .3s}
/* layer legend */
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 8px}
.legend .chip{font-size:10.5px;padding:5px 9px}
.empty{color:var(--dim);text-align:center;font-size:12.5px;padding:26px 0}
h3.sec{font-size:12px;color:var(--gold);letter-spacing:1.2px;text-transform:uppercase;margin:14px 0 6px}
@media (min-width:760px){ #sheet{left:auto;right:0;width:430px;height:100dvh;border-radius:0;transform:translateX(102%)} #sheet.open{transform:translateX(0)} #sheet .grab{display:none} }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="topbar">
      <div id="title">CHÂM CỨU 3D<small>ATLAS KINH LẠC</small></div>
      <div class="sp"></div>
      <button class="pillbtn" id="btnReset">⟲ Reset</button>
      <button class="pillbtn" id="btnSpin">▶ Xoay</button>
    </div>
    <div id="compass"><span id="compassTxt">MẶT TRƯỚC</span></div>
    <div id="quick"><div class="qt"></div><div class="qs"></div></div>
    <div id="toolbar"></div>
    <div id="hint">1 ngón: xoay · 2 ngón: di chuyển · chụm: phóng to · chạm huyệt: chọn</div>
  </div>
  <div id="nav">
    <button class="navbtn on" data-tab="map"><span class="ic">🧍</span>Bản đồ 3D</button>
    <button class="navbtn" data-tab="kinh"><span class="ic">☯</span>Kinh lạc</button>
    <button class="navbtn" data-tab="huyet"><span class="ic">✦</span>Tra cứu</button>
    <button class="navbtn" data-tab="hoc"><span class="ic">🎓</span>Học</button>
    <button class="navbtn" data-tab="lop"><span class="ic">🫀</span>Lớp cơ thể</button>
  </div>
</div>
<div id="sheet"><div class="grab"></div>
  <div id="sheetHead"><h2 id="sheetTitle">—</h2><div style="flex:1"></div><button class="xbtn" id="sheetClose">✕</button></div>
  <div id="sheetBody"></div>
</div>
<div id="toast"></div>

<script>
/* ============================================================
   DỮ LIỆU KINH LẠC & HUYỆT ĐẠO — 14 kinh chính (12 kinh + Nhâm, Đốc)
   part: t=thân  a=tay  l=chân  h=đầu/mặt  f=bàn chân
   y: vị trí dọc cơ thể 0 (bàn chân) → 1 (đỉnh đầu)
   a: góc quanh trục, 0 = phía trước, 90 = bên hông, 180 = sau lưng
   ============================================================ */
const EL_COLOR = {kim:'#e8c96a', moc:'#5fbf6e', thuy:'#4aa8ff', hoa:'#e0604f', tho:'#c98bd4'};
const EL_NAME  = {kim:'Kim', moc:'Mộc', thuy:'Thủy', hoa:'Hỏa', tho:'Thổ'};

const MERIDIANS = [
{id:'LU', name:'Thủ Thái Âm Phế', el:'kim', side:'both',
 desc:'Kinh Phế khởi đầu từ vùng dạ dày-trung tiêu, đi xuống đại tràng, lên ngực, ra cạnh nách, dọc mặt trước-trong cánh tay xuống đầu ngón tay cái. Chủ khí của Phế, liên quan hô hấp, da lông, hệ miễn dịch.',
 pts:[
 ['LU1','Trung Phủ','t',.74,28,'Trước ngực, dưới mỏm xương đòn trong 1 thốn. Chủ ho, khái huyết, đau vai ngực, viêm phế quản.'],
 ['LU2','Vân Môn','t',.76,35,'Dưới đầu xương đòn, trên xương sườn 2, cách giữa 6 thốn. Chủ ho, hen suyễn, đau ngực, tê cánh tay.'],
 ['LU3','Thiên Phủ','a',.72,25,'Mặt trước cánh tay, dưới nếp nách 3 thốn. Chủ ho, khó thở, đau vai, ứ huyết mũi.'],
 ['LU4','Hạ Bạch','a',.62,25,'Mặt trước cánh tay, cách nếp khuỷu 5 thốn. Chủ ho, đầy tức ngực, đau cánh tay, viêm khớp vai.'],
 ['LU5','Xích Trạch','a',.56,10,'Nếp khuỷu, gân cơ nhị đầu ngoài. Huyệt hợp (Thủy) của Phế: thanh nhiệt phế, chủ ho, viêm họng, sốt.'],
 ['LU6','Khổng Tối','a',.54,5,'Cách nếp khuỷu 7 thốn. Huyệt giao hội duy nhất của kinh Phế: chủ ho, đau đầu, viêm họng hạt, nhiều đờm.'],
 ['LU7','Liệt Khuyết','a',.52,0,'Trên nếp cổ tay 1.5 thốn, rãnh xương bàn tay. Huyệt Lạc, thông Nhâm: chủ đau đầu, cổ cứng, ho, mệt mỏi.'],
 ['LU8','Kinh Khâu','a',.51,5,'Trên nếp cổ tay 1 thốn. Huyệt Kinh (Kim): chủ ho suyễn, đau ngực, đau cổ tay, hầu họng.'],
 ['LU9','Thái Uyên','a',.47,0,'Nếp cổ tay, động mạch sau xương bàn tay ngón cái. Huyệt Du (Thổ) — bổ phế khí: chủ ho, khí suy, mạch yếu.'],
]},
{id:'LI', name:'Thủ Dương Minh Đại Tràng', el:'kim', side:'both',
 desc:'Kinh Đại tràng khởi đầu đầu ngón trỏ, đi dọc mặt ngoài-sau cánh tay lên vai, qua cổ, lên má, vào răng, chạm mũi. Chủ tiêu hóa, truyền dẫn cặn bã, liên quan da và hệ hô hấp.',
 pts:[
 ['LI1','Thương Dương','a',.46,180,'Mặt ngoài đầu ngón tay trỏ, cách móng 0.1 thốn. Huyệt Tỉnh (Kim): thanh nhiệt, chủ đau răng, viêm họng, co giật.'],
 ['LI2','Nhị Gian','a',.475,180,'Sau khớp ngón tay 2. Chủ sốt, đau răng, đau mắt đỏ, yếu ngón tay.'],
 ['LI3','Tam Gian','a',.50,170,'Sau khớp ngón tay 2. Chủ đau răng, viêm họng, đầy bụng, sốt không ra mồ hôi.'],
 ['LI4','Hợp Cốc','a',.51,170,'Giữa ngón cái và ngón trỏ. Huyệt Nguyên: chủ đau đầu, rối loạn tiêu hóa, đau răng, tê liệt mặt — huyệt dùng nhiều nhất toàn thân.'],
 ['LI5','Dương Khê','a',.54,160,'Nếp cổ tay, giữa xương quản và xương bàn tay. Huyệt Kinh: chủ đau đầu, đau mắt, điếc tai, viêm cổ tay.'],
 ['LI7','Ôn Lưu','a',.56,155,'Trên nếp cổ tay 5 thốn. Huyệt Kinh: chủ đau đầu, mặt sưng, viêm họng, sốt.'],
 ['LI10','Thủ Tam Lý','a',.60,150,'Cách nếp khuỷu dưới 2 thốn. Huyệt Hợp: chủ đau bụng, tiêu chảy, táo bón, yếu cơ tay.'],
 ['LI11','Khúc Trì','a',.64,145,'Nếp khuỷu ngoài. Huyệt Hợp (Thổ): thanh nhiệt giải độc, chủ sốt, viêm da, đau khuỷu, cao huyết áp.'],
 ['LI14','Tỉnh Ngoại Du','t',.76,110,'Giữa đầu xương đòn và mỏm vai. Chủ đau vai, tê tay, viêm khớp vai, trĩ.'],
 ['LI20','Nghinh Hương','h',.895,15,'Cạnh cánh mũi, cách rãnh mũi má 0.5 thốn. Chủ viêm mũi, ngạt mũi, mất khứu giác, liệt mặt.'],
]},
{id:'ST', name:'Túc Dương Minh Vị', el:'tho', side:'both',
 desc:'Kinh Dạ dày khởi đầu dưới mắt, qua má, quanh môi, lên trán, xuống cổ-ngực-bụng, dọc mặt trước chân xuống ngón 2. Chủ tiêu hóa, thụ nạp dinh dưỡng — "hậu thiên chi bản".',
 pts:[
 ['ST1','Thừa Khấp','h',.90,0,'Trực tiếp dưới con ngươi, giữa bờ dưới mí mắt. Chủ đau mắt, chảy nước mắt, liệt mặt, đau đầu.'],
 ['ST2','Tứ Bạch','h',.895,20,'Dưới mắt 1 thốn, hốc xương gò má. Chủ mắt mờ, chảy nước mắt, co giật mí mắt, đau đầu trước trán.'],
 ['ST4','Địa Thương','h',.875,38,'Cách khóe miệng 0.4 thốn. Chủ liệt mặt, trĩ, co giật miệng, đau răng.'],
 ['ST6','Giáp Xa','h',.855,55,'Cách góc hàm 1 thốn, nhai cơ sắc. Chủ viêm tuyến mang tai, rối loạn khớp hàm, đau răng, liệt mặt.'],
 ['ST9','Nhân Nghinh','t',.78,42,'Bờ ngoài cơ ức đòn chũi, động mạch cảnh. Chủ viêm họng, đau cổ, cao huyết áp, hen suyễn.'],
 ['ST12','Khuyết Bồn','t',.745,33,'Trên xương sườn 4, cách giữa 4 thốn. Chủ đau ngực, ho, viêm phế quản, đau vai.'],
 ['ST18','Nhũ Căn','t',.71,15,'Dưới núm vú 1 thốn, trong núm 4 thốn. Chủ đau ngực, tắc sữa, viêm tuyến sữa.'],
 ['ST25','Thiên Khâu','t',.615,15,'Ngang rốn, cách 2 thốn. Huyệt Mộ của đại tràng: chủ đau bụng, tiêu chảy, táo bón, rối loạn kinh nguyệt.'],
 ['ST36','Túc Tam Lý','l',.28,5,'Cách mỏm xương bánh chè dưới 3 thốn. Huyệt Hợp (Thổ) — bổ khí huyết, kiện tỳ vị: chủ suy nhược, đau dạ dày, yếu chân.'],
 ['ST40','Phong Long','l',.24,12,'Ngoài cẳng chân 8 thốn dưới đầu gối. Huyệt Lạc: chủ nhiều đờm, đau đầu chóng mặt, thấp tý.'],
 ['ST41','Giải Khê','l',.10,5,'Hốc giữa gân cơ, giữa mắt cá ngoài và xương bàn chân. Huyệt Kinh (Hỏa): chủ đau đầu, đau cổ, viêm dạ dày.'],
 ['ST42','Xung Dương','f',.06,0,'Bàn chân, chỗ hõm giữa ngón 2-3. Huyệt Nguyên: chủ đau răng, sốt, mất ngủ, đau bụng.'],
]},
{id:'SP', name:'Túc Thái Âm Tỳ', el:'tho', side:'both',
 desc:'Kinh Tỳ khởi đầu ngón chân cái, dọc mặt trong chân lên bụng, ngực, dưới lưỡi. Chủ vận hóa, thống huyết — "hậu thiên chi bản", kiện tỳ sinh huyết dưỡng cơ thể.',
 pts:[

/* ============================================================
   3D ENGINE — cơ thể stylized + kinh lạc + huyệt đạo
   ============================================================ */
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.insertBefore(renderer.domElement,stage.firstChild);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,1,0.1,50);
camera.position.set(0,1.32,3.4);camera.lookAt(0,1.0,0);
scene.add(new THREE.AmbientLight(0x8aa4c0,.85));
const key=new THREE.DirectionalLight(0xfff2dd,1.05);key.position.set(2,3,4);scene.add(key);
const rim=new THREE.DirectionalLight(0x4aa8ff,.6);rim.position.set(-2,1.5,-3);scene.add(rim);
scene.add(new THREE.GridHelper(2.4,24,0x1c2c3c,0x141e2a)).position.y=0.0;

const body=new THREE.Group();scene.add(body);
const skinMat=new THREE.MeshStandardMaterial({color:0xc79a72,roughness:.72,metalness:.05,transparent:true,opacity:.92});
const mats=[];
function M(m){mats.push(m);return m;}
function addPart(geo,mat,x,y,z){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);body.add(m);return m;}
/* da (body surface) */
addPart(new THREE.SphereGeometry(.115,24,20),skinMat,0,1.60,0);                 // đầu
addPart(new THREE.CylinderGeometry(.055,.06,.14,16),skinMat,0,1.475,0);          // cổ
addPart(new THREE.CylinderGeometry(.175,.135,.56,24),skinMat,0,1.17,0);          // thân
addPart(new THREE.SphereGeometry(.14,20,16),skinMat,0,.90,0);                   // hông
[-1,1].forEach(s=>{
  addPart(new THREE.SphereGeometry(.062,14,12),skinMat,s*.225,1.425,0);          // vai
  addPart(new THREE.CylinderGeometry(.048,.042,.60,14),skinMat,s*.225,1.11,0);   // cánh tay
  addPart(new THREE.SphereGeometry(.052,12,10),skinMat,s*.225,.79,0);           // bàn tay
  addPart(new THREE.CylinderGeometry(.068,.058,.86,16),skinMat,s*.10,.47,0);    // chân
  const foot=addPart(new THREE.SphereGeometry(.07,14,10),skinMat,s*.10,.045,.05);
  foot.scale.set(1,.62,1.7);
});
/* bộ xương */
const boneMat=M(new THREE.MeshStandardMaterial({color:0xd8e2ea,roughness:.5,wireframe:true,transparent:true,opacity:.55}));
const bones=new THREE.Group();bones.visible=false;body.add(bones);
function bPart(geo,x,y,z){const m=new THREE.Mesh(geo,boneMat);m.position.set(x,y,z);bones.add(m);}
bPart(new THREE.SphereGeometry(.10,10,8),0,1.60,0);
bPart(new THREE.CylinderGeometry(.15,.12,.55,10,1,true),0,1.17,0);
bPart(new THREE.SphereGeometry(.125,10,8),0,.90,0);
[-1,1].forEach(s=>{bPart(new THREE.CylinderGeometry(.04,.035,.58,8,1,true),s*.225,1.11,0);
 bPart(new THREE.CylinderGeometry(.06,.05,.84,8,1,true),s*.10,.47,0);});
/* cơ */
const muscleMat=M(new THREE.MeshStandardMaterial({color:0xb0645a,roughness:.6,transparent:true,opacity:.6}));
const muscles=new THREE.Group();muscles.visible=false;body.add(muscles);
function muPart(geo,x,y,z){const m=new THREE.Mesh(geo,muscleMat);m.position.set(x,y,z);muscles.add(m);}
muPart(new THREE.CylinderGeometry(.185,.15,.5,18),0,1.19,0);
[-1,1].forEach(s=>{muPart(new THREE.CylinderGeometry(.056,.05,.58,12),s*.228,1.11,0);
 muPart(new THREE.CylinderGeometry(.075,.065,.84,14),s*.102,.47,0);});
/* cơ quan nội tạng */
const organMat=M(new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.95,roughness:.4}));
const organs=new THREE.Group();organs.visible=false;body.add(organs);
function organ(geo,color,x,y,z){const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color,roughness:.45,transparent:true,opacity:.95}));organMat&&mats.push(m.material);m.position.set(x,y,z);organs.add(m);return m;}
organ(new THREE.SphereGeometry(.075,14,12),0xd96a6a,-.06,1.26,.02).scale.set(1,1.25,.9); // tim
organ(new THREE.SphereGeometry(.11,14,12),0xe8b4b4,.10,1.30,-.01).scale.set(.8,1.2,.55);  // phổi phải
organ(new THREE.SphereGeometry(.10,14,12),0xe8b4b4,-.11,1.31,-.01).scale.set(.8,1.1,.55); // phổi trái
organ(new THREE.SphereGeometry(.10,14,12),0x8a5a3a,.09,1.00,.01).scale.set(1.15,.7,.8);   // gan
organ(new THREE.SphereGeometry(.09,14,12),0xd9c98a,-.09,1.02,.01).scale.set(1,.8,.7);    // dạ dày
organ(new THREE.SphereGeometry(.045,10,8),0xa8504a,.055,1.00,-.06);                      // thận phải
organ(new THREE.SphereGeometry(.045,10,8),0xa8504a,-.055,1.00,-.06);                     // thận trái

/* ---------- vị trí huyệt ---------- */
const ALL_POINTS=[];
function posOf(part,y,a,side){ // side: 1 phải, -1 trái, 0 giữa
  const rad=a*Math.PI/180;
  if(part==='h'){
    if(a===-1)return new THREE.Vector3(0,1.60+.118,0);
    const t=Math.min(1,Math.max(0,(y-.83)/.155));
    const el=(1-t)*Math.PI, az=rad;
    return new THREE.Vector3(.118*Math.sin(el)*Math.sin(az),1.60+.118*Math.cos(el),.118*Math.sin(el)*Math.cos(az));
  }
  if(part==='f'){
    const sx=side===0?1:side;
    return new THREE.Vector3(sx*.10+.045*Math.sin(rad),.055,.08+.045*Math.cos(rad));
  }
  if(part==='t'){
    const yy=.90+(y-.43)/.35*.60;
    const k=Math.sqrt(Math.max(.12,1-Math.pow((yy-1.17)/.34,2)));
    const rx=.168*k,rz=.132*k;
    return new THREE.Vector3((side===0?1:side)*rx*Math.sin(rad),yy,rz*Math.cos(rad));
  }
  if(part==='a'){
    const yy=.80+(y-.45)/.33*.64;
    const sx=side===0?1:side;
    return new THREE.Vector3(sx*.225+sx*.048*Math.sin(rad),yy,.048*Math.cos(rad));
  }
  // chân
  const yy=.06+(y-.03)/.425*.84;
  const sx=side===0?1:side;
  let eff=a; if(a<=20)eff=-90+a;            // huyệt kinh âm → mặt trong chân
  const rr=eff*Math.PI/180;
  return new THREE.Vector3(sx*.10+sx*.062*Math.sin(rr),yy,.062*Math.cos(rr));
}
/* ---------- kinh lạc + huyệt ---------- */
const meridianGroups={},pointMeshes=[];
const sphereGeo=new THREE.SphereGeometry(.0125,10,8);
MERIDIANS.forEach(m=>{
  const g=new THREE.Group();body.add(g);meridianGroups[m.id]=g;
  const col=new THREE.Color(EL_COLOR[m.el]);
  const sides=m.side==='mid'?[0]:(m.side==='both'?[1,-1]:[1]);
  sides.forEach(sd=>{
    const pts=m.pts.map(p=>posOf(p[2],p[3],p[4],sd));
    if(pts.length>1){
      const curve=new THREE.CatmullRomCurve3(pts);
      const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,72,.0042,6,false),
        new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.8}));
      g.add(tube);
    }
    m.pts.forEach(p=>{
      const mesh=new THREE.Mesh(sphereGeo,new THREE.MeshBasicMaterial({color:col}));
      mesh.position.copy(posOf(p[2],p[3],p[4],sd));
      mesh.userData={code:p[0],vn:p[1],m:m.id,side:sd===0?'giữa':(sd===1?'phải':'trái'),fn:p[5],el:m.el,part:p[2],y:p[3],a:sd===-1?-p[4]:p[4]};
      g.add(mesh);pointMeshes.push(mesh);ALL_POINTS.push(mesh.userData);
    });
  });
});
let activeMeridian=null;
function setActiveMeridian(id){
  activeMeridian=id;
  MERIDIANS.forEach(m=>{meridianGroups[m.id].visible=(id===null||id===m.id)&&state.show.mer;});
}
/* ---------- trạng thái hiển thị ---------- */
const state={show:{mer:true,pts:true,bones:false,muscles:false,organs:false},spin:false,skin:.92,psize:1};
function applyState(){
  meridianGroups&&MERIDIANS.forEach(m=>{meridianGroups[m.id].visible=state.show.mer&&(activeMeridian===null||activeMeridian===m.id);});
  pointMeshes.forEach(p=>{p.visible=state.show.pts&&(activeMeridian===null||activeMeridian===p.userData.m);
    p.scale.setScalar(state.psize*(p.userData.code===selCode?1.9:1));});
  bones.visible=state.show.bones;muscles.visible=state.show.muscles;organs.visible=state.show.organs;
  skinMat.opacity=state.skin;
  buildToolbar();
}
/* ---------- điều khiển camera ---------- */
let rotY=0,rotX=0,tRotY=0,tRotX=0,dist=3.4,tDist=3.4;
const pointers=new Map();let lastPinch=0,downPos=null,downT=0,longT=null,moved=false;
const cvs=renderer.domElement;
cvs.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});downPos={x:e.clientX,y:e.clientY};downT=Date.now();moved=false;
  longT=setTimeout(()=>{if(!moved)showQuick(e);},520);});
cvs.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  const prev=pointers.get(e.pointerId);
  const dx=e.clientX-prev.x,dy=e.clientY-prev.y;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){tRotY+=dx*.008;tRotX=Math.max(-1.2,Math.min(1.2,tRotX+dy*.006));}
  else if(pointers.size===2){state.spin=false;
    const arr=[...pointers.values()];const d=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);
    if(lastPinch)tDist=Math.max(1.7,Math.min(5.5,tDist*(lastPinch/d)));
    lastPinch=d;
    tRotY+=dx*.004;}
  if(downPos&&Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y)>7){moved=true;clearTimeout(longT);hideQuick();}
});
cvs.addEventListener('pointerup',e=>{
  pointers.delete(e.pointerId);lastPinch=0;clearTimeout(longT);
  if(!moved&&Date.now()-downT<450)pick(e);
});
cvs.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);clearTimeout(longT);hideQuick();});
cvs.addEventListener('dblclick',()=>{tRotY=0;tRotX=0;tDist=3.4;});
document.getElementById('btnReset').onclick=()=>{tRotY=0;tRotX=0;tDist=3.4;setActiveMeridian(null);applyState();toast('Đã reset góc nhìn');};
document.getElementById('btnSpin').onclick=function(){state.spin=!state.spin;this.classList.toggle('on',state.spin);this.textContent=state.spin?'❚❚ Xoay':'▶ Xoay';};
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
/* ---------- chọn huyệt ---------- */
const ray=new THREE.Raycaster();ray.params.Points={threshold:.05};
let selCode=null;
function pick(e){
  const r=cvs.getBoundingClientRect();
  const m=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(m,camera);
  const hits=ray.intersectObjects(pointMeshes.filter(p=>p.visible));
  if(hits.length){const u=hits[0].object.userData;selCode=u.code;applyState();openPointDetail(u.code);}
}
function showQuick(e){
  const r=cvs.getBoundingClientRect();
  const m=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(m,camera);
  const hits=ray.intersectObjects(pointMeshes.filter(p=>p.visible));
  const q=document.getElementById('quick');
  if(hits.length){const u=hits[0].object.userData;
    q.querySelector('.qt').textContent=u.code+' · '+u.vn;
    q.querySelector('.qs').textContent=u.fn.slice(0,70)+'…';
    q.style.display='block';q.style.left=(e.clientX-r.left)+'px';q.style.top=(e.clientY-r.top)+'px';
  } else hideQuick();
}
function hideQuick(){document.getElementById('quick').style.display='none';}
/* ---------- render loop ---------- */
function loop(){
  requestAnimationFrame(loop);
  if(state.spin)tRotY+=.004;
  rotY+=(tRotY-rotY)*.12;rotX+=(tRotX-rotX)*.12;dist+=(tDist-dist)*.12;
  body.rotation.y=rotY;body.rotation.x=rotX;
  camera.position.set(0,1.32,dist);camera.lookAt(0,1.0,0);
  const deg=((rotY*180/Math.PI)%360+360)%360;
  document.getElementById('compassTxt').textContent=deg<60||deg>300?'MẶT TRƯỚC':(deg<120?'BÊN PHẢI':(deg<240?'SAU LƯNG':'BÊN TRÁI'));
  renderer.render(scene,camera);
}
loop();
</script>

   UI — sheet, toolbar, tab panel
   ============================================================ */
const sheet=document.getElementById('sheet'),sheetTitle=document.getElementById('sheetTitle'),sheetBody=document.getElementById('sheetBody');
document.getElementById('sheetClose').onclick=()=>sheet.classList.remove('open');
function openSheet(title,html){sheetTitle.innerHTML=title;sheetBody.innerHTML=html;sheetBody.scrollTop=0;sheet.classList.add('open');}
let toastT=null;
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>el.style.display='none',1800);}
const elBadge=(el,name)=>`<span class="elbadge" style="background:${EL_COLOR[el]}22;color:${EL_COLOR[el]};border:1px solid ${EL_COLOR[el]}55">${name||EL_NAME[el]}</span>`;
const merOf=c=>MERIDIANS.find(m=>m.id===c);
const partName={t:'Thân',a:'Tay',l:'Chân',h:'Đầu / Mặt',f:'Bàn chân'};

/* ---------- toolbar kinh ---------- */
function buildToolbar(){
  const tb=document.getElementById('toolbar');
  let h='';
  MERIDIANS.forEach(m=>{
    const on=activeMeridian===m.id;
    h+=`<div class="chip ${on?'on':''}" data-m="${m.id}"><span class="dot" style="background:${EL_COLOR[m.el]}"></span>${m.id}</div>`;
  });
  h+=`<div class="chip ${state.show.pts?'on':''}" data-t="pts">✦ Huyệt</div>`;
  h+=`<div class="chip ${state.show.bones?'on':''}" data-t="bones">🦴 Xương</div>`;
  h+=`<div class="chip ${state.show.organs?'on':''}" data-t="organs">🫀 Tạng</div>`;
  tb.innerHTML=h;
  tb.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    if(c.dataset.m){setActiveMeridian(activeMeridian===c.dataset.m?null:c.dataset.m);applyState();
      if(activeMeridian)toast('Đang hiển thị: '+merOf(activeMeridian).name);}
    else{const k=c.dataset.t;state.show[k]=!state.show[k];applyState();}
  });
}
buildToolbar();

/* ---------- tab panel ---------- */
let curTab='map';
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  curTab=b.dataset.tab;
  if(curTab==='map'){sheet.classList.remove('open');}
  if(curTab==='kinh')showMeridians();
  if(curTab==='huyet')showSearch();
  if(curTab==='hoc')showQuiz();
  if(curTab==='lop')showLayers();
});
/* ---------- KINH LẠC ---------- */
function showMeridians(filterEl){
  let h=`<div class="seg"><div class="${!filterEl?'on':''}" data-f="">Tất cả</div>${Object.keys(EL_NAME).map(e=>`<div class="${filterEl===e?'on':''}" data-f="${e}">${EL_NAME[e]}</div>`).join('')}</div>`;
  MERIDIANS.filter(m=>!filterEl||m.el===filterEl).forEach(m=>{
    h+=`<div class="row" data-m="${m.id}"><span class="dot" style="background:${EL_COLOR[m.el]}"></span>
      <div class="grow"><div class="t1">${m.name}</div><div class="t2">${m.pts.length} huyệt · ${EL_NAME[m.el]}</div></div>
      <span class="code">${m.id}</span></div>`;
  });
  openSheet('☯ Hệ thống Kinh Lạc',h);
  sheetBody.querySelectorAll('.seg div').forEach(d=>d.onclick=()=>showMeridians(d.dataset.f||null));
  sheetBody.querySelectorAll('.row').forEach(r=>r.onclick=()=>showMeridianDetail(r.dataset.m));
}
function showMeridianDetail(id){
  const m=merOf(id);
  let h=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">${elBadge(m.el)}<span style="font-size:11px;color:var(--dim)">${m.side==='mid'?'Kinh mạch giữa cơ thể':'Kinh hai bên cơ thể'}</span></div>
    <div class="pblock"><h4>Đường đi & Chức năng</h4><p>${m.desc}</p></div>
      <h3 class="sec">${m.pts.length} Huyệt</h3>`;
  m.pts.forEach(p=>{h+=`<div class="row" data-c="${p[0]}"><span class="dot" style="background:${EL_COLOR[m.el]}"></span>
    <div class="grow"><div class="t1">${p[1]}</div><div class="t2">${partName[p[2]]} · ${p[5].slice(0,52)}…</div></div><span class="code">${p[0]}</span></div>`;});
  openSheet(`☯ ${m.name} ${elBadge(m.el)}`,h);
  sheetBody.querySelectorAll('.row').forEach(r=>r.onclick=()=>openPointDetail(r.dataset.c));
  setActiveMeridian(id);applyState(); // chiếu kinh này trên model 3D ngay
}
/* ---------- CHI TIẾT HUYỆT ---------- */
function openPointDetail(code){
  const u=ALL_POINTS.find(p=>p.code===code);if(!u)return;
  const m=merOf(u.m);
  const el=u.el;
  let h=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">${elBadge(el)}<span class="code">${code}</span>
    <span style="font-size:11px;color:var(--dim)">bên ${u.side}</span></div>
  <div class="pblock"><h4>Tên huyệt</h4><p style="font-size:16px;font-weight:800">${u.vn}</p></div>
  <div class="pblock"><h4>Vị trí & Giải phẫu</h4>
    <div class="kv"><b>Vùng cơ thể</b><span>${partName[u.part]}</span></div>
    <div class="kv"><b>Kinh</b><span style="color:${EL_COLOR[el]}">${m.name} (${m.id})</span></div>
    <div class="kv"><b>Ngũ hành</b><span>${EL_NAME[el]}</span></div>
  </div>
  <div class="pblock"><h4>Công dụng chính</h4><p>${u.fn}</p></div>
  <div class="pblock"><h4>Ghi chú an toàn</h4><p style="font-size:12px;color:var(--dim)">Thông tin mang tính tham khảo học tập, tra cứu. Việc châm cứu, ấn huyệt cần được thực hiện bởi ngườI có chuyên môn y khoa.</p></div>
  <button class="mbtn" style="justify-content:center" id="btnZoom">🎯 Hiện trên bản đồ 3D</button>`;
  openSheet(`✦ ${code} · ${u.vn}`,h);
  document.getElementById('btnZoom').onclick=()=>{
    setActiveMeridian(u.m);applyState();sheet.classList.remove('open');
    selCode=code;applyState();
    toast('Đang chiếu huyệt '+code+' trên model 3D');
  };
  selCode=code;applyState();
}
/* ---------- TRA CỨU ---------- */
function showSearch(){
  const h=`<div id="searchBox"><input id="q" placeholder="Tìm huyệt theo tên hoặc mã: VD 'Hợp Cốc', 'LI4', 'Nội Quan'…"></div>
  <div class="seg" id="regSeg"><div class="on" data-r="">Tất cả</div><div data-r="h">Đầu · Mặt</div><div data-r="t">Thân</div><div data-r="a">Tay</div><div data-r="l">Chân</div></div>
  <div id="qres"></div>`;
  openSheet('✦ Tra cứu Huyệt Đạo',h);
  const inp=document.getElementById('q'),res=document.getElementById('qres');let reg='';
  function run(){
    const q=inp.value.trim().toLowerCase();
    const hits=ALL_POINTS.filter(u=>(!reg||u.part===reg)&&(!q||u.code.toLowerCase().includes(q)||u.vn.toLowerCase().includes(q)||u.fn.toLowerCase().includes(q)));
    res.innerHTML=hits.length?hits.slice(0,80).map(u=>`<div class="row" data-c="${u.code}">
      <span class="dot" style="background:${EL_COLOR[u.el]}"></span>
      <div class="grow"><div class="t1">${u.vn}</div><div class="t2">${merOf(u.m).name} · ${partName[u.part]}</div></div>
      <span class="code">${u.code}</span></div>`).join('')
      :'<div class="empty">Không tìm thấy huyệt phù hợp</div>';
    res.querySelectorAll('.row').forEach(r=>r.onclick=()=>openPointDetail(r.dataset.c));
  }
  inp.oninput=run;
  sheetBody.querySelectorAll('#regSeg div').forEach(d=>d.onclick=()=>{sheetBody.querySelectorAll('#regSeg div').forEach(x=>x.classList.remove('on'));d.classList.add('on');reg=d.dataset.r;run();});
  run();
}
/* ---------- HỌC — QUIZ ---------- */
const QUIZ_N=10;let quiz=[];
function genQuiz(){
  quiz=[];const pool=[...ALL_POINTS];
  for(let i=0;i<QUIZ_N&&pool.length;i++){
    const u=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    const type=i%3;
    let q,ans,opts;
    if(type===0){q=`Huyệt ${u.code} (${u.vn}) thuộc kinh nào?`;ans=merOf(u.m).name;
      opts=new Set([ans]);while(opts.size<4){const r=MERIDIANS[Math.floor(Math.random()*14)].name;opts.add(r);}opts=[...opts];}
    else if(type===1){q=`Huyệt ${u.code} nằm ở vùng nào cơ thể?`;ans=partName[u.part];
      opts=new Set([ans]);while(opts.size<4)opts.add(partName[['t','a','l','h','f'][Math.floor(Math.random()*5)]]);opts=[...opts];}
    else{q=`Kinh ${merOf(u.m).name} thuộc hành nào trong Ngũ Hành?`;ans=EL_NAME[u.el];
      opts=new Set([ans]);while(opts.size<4)opts.add(EL_NAME[['kim','moc','thuy','hoa','tho'][Math.floor(Math.random()*5)]]);opts=[...opts];}
    opts.sort(()=>Math.random()-.5);
    quiz.push({q,ans,opts,sel:null});
  }
}
function showQuiz(){
  genQuiz();
  let score=0;
  function render(){
    let h=`<div style="text-align:center;padding:8px 0 2px"><b style="font-size:15px">🎓 Kiểm tra Kinh Lạc</b>
      <div style="font-size:11px;color:var(--dim);margin-top:3px">10 câu ngẫu nhiên · ${ALL_POINTS.length} huyệt trong ngân hàng</div></div>
      <div class="qbar"><i style="width:${quiz.filter(x=>x.sel!==null).length*10}%"></i></div>`;
    quiz.forEach((it,i)=>{
      h+=`<div class="qcard"><div class="qq">${i+1}. ${it.q}</div>
      ${it.opts.map(o=>{let cls='';
        if(it.sel!==null){if(o===it.ans)cls='right';else if(o===it.sel)cls='wrong';}
        return `<button class="qopt ${cls}" data-i="${i}" data-o="${o}" ${it.sel!==null?'disabled':''}>${o}</button>`;}).join('')}
      ${it.sel!==null?`<div style="font-size:11px;color:${it.sel===it.ans?'#5fbf6e':'#e0604f'};margin-top:6px">${it.sel===it.ans?'✓ Chính xác':'✗ Đáp án đúng: '+it.ans}</div>`:''}
      </div>`;
    });
    const done=quiz.every(x=>x.sel!==null);
    if(done)h+=`<div style="text-align:center;padding:6px 0 20px"><b style="font-size:17px;color:var(--gold)">Điểm: ${quiz.filter(x=>x.sel===x.ans).length}/${QUIZ_N}</b>
      <button class="mbtn" style="justify-content:center;margin-top:10px" id="btnRe">🔄 Làm bộ câu hỏi mới</button></div>`;
    else h+=`<div style="font-size:11px;color:var(--dim);text-align:center;padding-bottom:18px">Trả lởi hết 10 câu để xem điểm</div>`;
    openSheet('🎓 Học & Kiểm tra',h);
    sheetBody.querySelectorAll('.qopt').forEach(b=>b.onclick=()=>{
      quiz[+b.dataset.i].sel=b.dataset.o;render();
    });
    const rb=document.getElementById('btnRe');if(rb)rb.onclick=()=>{genQuiz();render();};
  }
  render();
}
/* ---------- LỚP CƠ THỂ ---------- */
function showLayers(){
  const h=`<h3 class="sec">Lớp giải phẫu</h3>
  ${[['bones','🦴 Bộ xương','Khung xương dạng lưới'],['muscles','💪 Hệ cơ','Lớp cơ bắp chính'],['organs','🫀 Nội tạng','Tim · Phổi · Gan · Dạ dày · Thận']]
    .map(([k,ic,n])=>`<div class="row" data-l="${k}"><span style="font-size:18px">${ic}</span><div class="grow"><div class="t1">${n}</div></div>
    <span style="font-size:11px;color:${state.show[k]?'var(--gold)':'var(--dim)'};font-weight:700">${state.show[k]?'BẬT':'TẮT'}</span></div>`).join('')}
  <h3 class="sec">Độ trong cơ thể (Da)</h3>
  <div class="ctl"><label>Độ trong suốt</label><input type="range" id="rSkin" min="8" max="100" value="${Math.round(state.skin*100)}"></div>
  <h3 class="sec">Huyệt đạo</h3>
  <div class="ctl"><label>Cỡ chấm huyệt</label><input type="range" id="rPsz" min="6" max="22" value="${Math.round(state.psize*10)}"></div>
  <div class="pblock" style="margin-top:10px"><h4>Mẹo quan sát</h4><p style="font-size:12px;color:var(--dim)">Giảm độ trong suốt của da để nhìn xuyên thấy kinh lạc bên trong. Kết hợp bật Xương hoặc Nội tạng để đối chiếu vị trí huyệt với giải phẫu hiện đại.</p></div>
  <button class="mbtn" style="justify-content:center" id="btnAll">👁 Hiện tất cả lớp</button>
  <div class="disclaim" style="padding-top:8px">Ứng dụng phục vụ mục đích học tập & tra cứu tham khảo.<br>Không dùng để chẩn đoán hay điều trị y khoa.</div>`;
  openSheet('🫀 Lớp Cơ Thể',h);
  sheetBody.querySelectorAll('[data-l]').forEach(r=>r.onclick=()=>{const k=r.dataset.l;state.show[k]=!state.show[k];applyState();showLayers();});
  document.getElementById('rSkin').oninput=e=>{state.skin=e.target.value/100;applyState();};
  document.getElementById('rPsz').oninput=e=>{state.psize=e.target.value/10;applyState();};
  document.getElementById('btnAll').onclick=()=>{state.show.bones=state.show.muscles=state.show.organs=true;state.skin=.35;applyState();showLayers();toast('Đã bật xem tất cả lớp');};
}
/* ---------- init ---------- */
applyState();
toast('Chạm một huyệt trên model để xem chi tiết');
</script>
</body>
</html>
